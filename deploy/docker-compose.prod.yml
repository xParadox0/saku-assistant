# Production stack for saku.chronyxlabs.com on one host.
# Nothing listens on the LAN or the internet: the only way in is the Cloudflare Tunnel (cloudflared below),
# and Cloudflare Access sits in front of it. The web app re-checks the Access JWT itself.
#
#   cp deploy/env.example /srv/saku/.env && chmod 600 /srv/saku/.env   # fill in, never commit
#   docker compose -f deploy/docker-compose.prod.yml --env-file /srv/saku/.env up -d --build
name: saku

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saku
      POSTGRES_USER: saku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - saku-pg:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saku -d saku"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "saku", "serve", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      DATABASE_URL: postgresql://saku:${POSTGRES_PASSWORD}@db:5432/saku
      SAKU_AUTH_MODE: ${SAKU_AUTH_MODE:-cloudflare}
      SAKU_MAIL: ${SAKU_MAIL:-graph}
      SAKU_GRAPH_TENANT: ${SAKU_GRAPH_TENANT:-}
      SAKU_GRAPH_CLIENT_ID: ${SAKU_GRAPH_CLIENT_ID:-}
      SAKU_GRAPH_CLIENT_SECRET: ${SAKU_GRAPH_CLIENT_SECRET:-}
      SAKU_MAIL_FROM: ${SAKU_MAIL_FROM:-}
      SAKU_CF_TEAM: ${SAKU_CF_TEAM:?set in .env}
      SAKU_CF_AUD: ${SAKU_CF_AUD:?set in .env}
      SAKU_SECRET: ${SAKU_SECRET:?set in .env}
      SAKU_BOT_USERNAME: ${SAKU_BOT_USERNAME:-}
      SAKU_REGISTRATION: ${SAKU_REGISTRATION:-closed}
      SAKU_PENDING_CAP: ${SAKU_PENDING_CAP:-50}
      SAKU_APPROVED_CAP: ${SAKU_APPROVED_CAP:-20}
      SAKU_POLICY_REVIEWED: ${SAKU_POLICY_REVIEWED:-}
      SAKU_CONTACT: ${SAKU_CONTACT:-}
      SAKU_PARSER_SOCKET: /run/saku-parser/parser.sock
    depends_on:
      db: { condition: service_healthy }
      parser: { condition: service_healthy }
    networks: [internal, edge, egress]   # egress for Access signing keys and Microsoft Graph mail; no published ports
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - saku-parser-socket:/run/saku-parser
    security_opt: ["no-new-privileges:true"]

  parser:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "saku.parser_service"]
    network_mode: none
    volumes:
      - saku-parser-socket:/run/saku-parser
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-m", "saku.parser_service", "--healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

  bot:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "saku", "bot"]
    environment:
      DATABASE_URL: postgresql://saku:${POSTGRES_PASSWORD}@db:5432/saku
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      SAKU_AGENT_SOCKET: /run/saku-agent/agent.sock
      SAKU_STT_SOCKET: /run/saku-stt/stt.sock
    volumes:
      - /home/yona/.local/run/saku-agent:/run/saku-agent:ro
      - /home/yona/.local/run/saku-stt:/run/saku-stt:ro
    depends_on: { db: { condition: service_healthy } }
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in .env}
    depends_on: [web]
    networks: [edge, egress]
    security_opt: ["no-new-privileges:true"]

volumes:
  saku-pg:
  saku-parser-socket:

networks:
  internal: { internal: true }   # db, web, bot: no route out
  edge: { internal: true }       # tunnel -> web only
  egress: {}                     # tunnel and bot reach Cloudflare / Telegram
