name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saku_test
          POSTGRES_USER: saku
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saku -d saku_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://saku:ci-only@localhost:5432/saku_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  compose-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose demo on a clean machine
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from app | tee demo.log
          grep -q "own transfers paired: 15" demo.log
          grep -q "No real accounts are involved" demo.log
      - name: dashboard on a clean machine
        run: |
          docker compose --profile dashboard up --build -d web
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8090/healthz && break; sleep 2; done
          test "$(docker inspect "$(docker compose ps -q parser)" --format '{{.HostConfig.NetworkMode}}')" = none
          test "$(docker inspect "$(docker compose ps -q parser)" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          docker compose exec -T parser python -c 'import os,socket; assert not any(k in os.environ for k in ("DATABASE_URL","POSTGRES_PASSWORD","SAKU_SECRET")); s=socket.socket(); s.settimeout(0.2); assert s.connect_ex(("1.1.1.1",53)) != 0; print("parser isolation verified")'
          docker compose exec -T web python -c 'import asyncio; from saku.parsers.worker_client import ParserClient; r=asyncio.run(ParserClient().parse_upload(b"date,amount,description\\n2026-09-01,-1.00,SYNTHETIC\\n", ".csv", {"provider":"bca","last4":None})); assert r.error is None and r.parser=="saku-csv/1" and len(r.rows)==1 and r.rows[0].description=="SYNTHETIC"; print("cross-container parser round-trip verified")'
          # Demo Compose defaults to closed registration; production explicitly sets it open.
          curl -sf http://127.0.0.1:8090/ | grep -q "Registration opens after"
          curl -sf http://127.0.0.1:8090/demo | tee demo.html | grep -q "Rp14.445.020"
          curl -sf http://127.0.0.1:8090/app | grep -q "Rp14.445.020"
          curl -sf http://127.0.0.1:8090/app/accounts | grep -q "Wallet (demo)"
          curl -sf http://127.0.0.1:8090/app/admin | grep -q "No component has reported yet"
          curl -sf -b saku_lang=id http://127.0.0.1:8090/privacy | grep -q "UU PDP"
          docker compose --profile dashboard down -v
