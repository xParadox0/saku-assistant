# Local demo stack. The database port is not published, and the password below is a
# local-only demo value. Use real secrets and Cloudflare Access for anything else.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from app   CLI demo
#   docker compose --profile dashboard up --build web                          dashboard on http://127.0.0.1:8090
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saku
      POSTGRES_USER: saku
      POSTGRES_PASSWORD: saku-demo-only
    volumes:
      - saku_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saku -d saku"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://saku:saku-demo-only@db:5432/saku
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["dashboard"]
    build: .
    command: ["python", "-m", "saku", "serve", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      DATABASE_URL: postgresql://saku:saku-demo-only@db:5432/saku
      SAKU_AUTH_MODE: dev              # demo identity, synthetic data only
      SAKU_DEV_EMAIL: demo@saku.local
      SAKU_DEV_CONTAINER: "1"          # allows 0.0.0.0 inside the container; the host port below stays on loopback
      SAKU_LOAD_DEMO: "1"
      SAKU_PARSER_SOCKET: /run/saku-parser/parser.sock
    volumes:
      - saku_parser_socket:/run/saku-parser
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_healthy

  parser:
    profiles: ["dashboard"]
    build: .
    command: ["python", "-m", "saku.parser_service"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - saku_parser_socket:/run/saku-parser
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-m", "saku.parser_service", "--healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

volumes:
  saku_pg:
  saku_parser_socket:
